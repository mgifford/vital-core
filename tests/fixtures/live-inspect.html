<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Live inspect fixture</title></head>
<body>
<main>
  <h1>Live inspect fixture</h1>
  <p>Static fixture for the live highlighter tests.</p>
  <button id="named" class="target" type="button" aria-label="Save changes">Save</button>
  <button id="delete" class="delete-target" type="button" aria-label="Delete">Delete</button>
  <button id="role-target" class="role-target" type="button" role="switch" aria-label="Toggle preference">Toggle</button>
  <div class="dupe">First duplicate</div>
  <div class="dupe">Second duplicate</div>
  <div id="unnamed">Unnamed element</div>
  <div style="height: 2400px" aria-hidden="true"></div>
  <button id="far" type="button" aria-label="Far away">Far away</button>
  <button id="hidden-initial" type="button" aria-label="Hidden target" style="display: none">Hidden target</button>
  <button class="pick" type="button" aria-label="Pick me" style="display: none">Hidden pick</button>
  <button class="pick" type="button" aria-label="Pick me">Visible pick</button>
  <div class="desktop:display-block">
    <div class="usa-nav__secondary">
      <ul class="usa-nav__secondary-links">
        <li><a target="_self" href="/federal-policy-guidance/faq" aria-label="Go to Frequently Asked Questions (FAQs)">FAQs</a></li>
      </ul>
    </div>
  </div>
</main>
</body>
</html>
