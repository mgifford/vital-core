# Runs on every PR (no paths filter) so i18n template drift and pipeline
# regressions in src/ are caught; spec-kitty-governance.yml only fires on
# governance paths.
name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: i18n template is current
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end test (local fixture site)
        run: npm run test:e2e
