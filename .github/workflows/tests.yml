# Runs on every PR (no paths filter) so i18n template drift and pipeline
# regressions in src/ are caught; spec-kitty-governance.yml only fires on
# governance paths.
name: tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: i18n template is current
        run: npm run i18n:check

      - name: Unit tests
        run: npm run test:unit

      - name: End-to-end test (local fixture site)
        run: npm run test:e2e
