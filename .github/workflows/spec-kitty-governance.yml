# Spec Kitty governance validation.
name: spec-kitty-governance

on:
  push:
    branches:
      - main
      - hf-spaces
    paths:
      - '.agents/**'
      - '.github/workflows/spec-kitty-governance.yml'
      - '.kittify/**'
      - 'kitty-specs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-spec-kitty-governance.js'
  pull_request:
    paths:
      - '.agents/**'
      - '.github/workflows/spec-kitty-governance.yml'
      - '.kittify/**'
      - 'kitty-specs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/check-spec-kitty-governance.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --omit=optional --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Parse workflow YAML
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.yml'].sort.each { |f| YAML.safe_load_file(f, permitted_classes: []); puts \"parsed #{f}\" }"

      - name: Check Spec Kitty governance
        run: npm run check:spec-kitty

      - name: Diff hygiene
        run: git diff --check && git diff --cached --check

      - name: Unit tests
        run: npm run test:unit